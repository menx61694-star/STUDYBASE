name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android platform scaffold
        run: flutter create --platforms=android --no-pub .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      - name: Verify launcher icon output
        run: test -f android/app/src/main/res/mipmap-hdpi/launcher_icon.png
